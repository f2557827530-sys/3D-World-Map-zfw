<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能合集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+SC:wght@300;400;500&display=swap">
  <style>
    :root {
      --bg: #050812;
      --grid: rgba(56, 130, 246, 0.12);
      --blue: #3b82f6;
      --cyan: #06b6d4;
      --gold: #d4a96a;
      --amber: #f59e0b;
      --text: #e8eaf6;
      --text-dim: rgba(200, 210, 240, 0.5);
      --card-bg: rgba(10, 18, 40, 0.7);
      --border: rgba(255,255,255,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── 粒子画布 ── */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── 透视网格 ── */
    .grid-floor {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 55vh;
      background:
        linear-gradient(rgba(56,130,246,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,130,246,0.18) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(600px) rotateX(55deg);
      transform-origin: bottom center;
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.6) 30%, black 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.6) 30%, black 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── 渐变光晕 ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 600px; height: 600px;
      top: -200px; left: -150px;
      background: radial-gradient(circle, rgba(56,130,246,0.18) 0%, transparent 70%);
      animation-delay: 0s;
    }
    .orb-2 {
      width: 500px; height: 500px;
      bottom: -150px; right: -100px;
      background: radial-gradient(circle, rgba(212,169,106,0.14) 0%, transparent 70%);
      animation-delay: -6s;
    }
    .orb-3 {
      width: 400px; height: 400px;
      top: 30%; left: 40%;
      background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 70%);
      animation-delay: -3s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* ── 顶部栏 ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 1.8rem;
      gap: 1rem;
      background: rgba(5, 8, 18, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .logo-text {
      font-family: "Orbitron", monospace;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.15em;
      background: linear-gradient(90deg, var(--cyan) 0%, var(--blue) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .topbar-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(56,130,246,0.4), rgba(6,182,212,0.2), transparent);
    }

    .topbar-tag {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* ── 主体内容 ── */
    .main {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 80px 2rem 2rem;
    }

    /* ── 标题区 ── */
    .headline {
      text-align: center;
    }

    .headline-eyebrow {
      font-family: "Orbitron", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0.85;
    }

    .headline h1 {
      font-family: "Orbitron", monospace;
      font-size: clamp(1.8rem, 4.5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, var(--cyan) 40%, var(--blue) 70%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-wrap: balance;
      margin-bottom: 0.9rem;
    }

    .headline p {
      font-size: clamp(0.8rem, 1.3vw, 0.92rem);
      color: var(--text-dim);
      letter-spacing: 0.12em;
    }

    /* ── 卡片组 ── */
    .cards {
      display: flex;
      gap: 1.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 300px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.2rem 1.8rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: default;
    }

    /* 卡片顶部光条 */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      border-radius: 999px;
    }

    /* 扫光动画 */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .card:hover::after { transform: translateX(100%); }

    .card:hover {
      transform: translateY(-8px);
    }

    /* 卡片 A — 3D 地图 */
    .card-map::before { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .card-map:hover {
      border-color: rgba(56,130,246,0.5);
      box-shadow: 0 0 0 1px rgba(56,130,246,0.3), 0 20px 50px rgba(56,130,246,0.2), 0 0 80px rgba(6,182,212,0.1);
    }

    /* 卡片 B — 阅读器 */
    .card-reader::before { background: linear-gradient(90deg, var(--gold), var(--amber)); }
    .card-reader:hover {
      border-color: rgba(212,169,106,0.5);
      box-shadow: 0 0 0 1px rgba(212,169,106,0.3), 0 20px 50px rgba(212,169,106,0.15), 0 0 80px rgba(245,158,11,0.08);
    }

    /* 图标圆圈 */
    .card-icon {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.2rem;
    }
    .card-icon::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid transparent;
      animation: spin-ring 6s linear infinite;
    }
    .card-map .card-icon {
      background: linear-gradient(135deg, rgba(56,130,246,0.25), rgba(6,182,212,0.15));
      box-shadow: 0 0 30px rgba(56,130,246,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .card-map .card-icon::before {
      border-color: rgba(56,130,246,0.5) transparent transparent rgba(6,182,212,0.3);
    }
    .card-reader .card-icon {
      background: linear-gradient(135deg, rgba(212,169,106,0.25), rgba(245,158,11,0.15));
      box-shadow: 0 0 30px rgba(212,169,106,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .card-reader .card-icon::before {
      border-color: rgba(212,169,106,0.5) transparent transparent rgba(245,158,11,0.3);
    }

    @keyframes spin-ring {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .card-icon svg { width: 2rem; height: 2rem; }

    .card h2 {
      font-family: "Orbitron", monospace;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text);
    }

    .card p {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.75;
      letter-spacing: 0.02em;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.2rem;
    }

    .tag {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid;
    }
    .card-map .tag { color: var(--cyan); border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.06); }
    .card-reader .tag { color: var(--gold); border-color: rgba(212,169,106,0.3); background: rgba(212,169,106,0.06); }

    .card-btn {
      margin-top: 0.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.8rem;
      border-radius: 999px;
      font: inherit;
      font-size: 0.83rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      border: 1px solid;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card-map .card-btn {
      background: linear-gradient(135deg, rgba(56,130,246,0.2), rgba(6,182,212,0.1));
      border-color: rgba(56,130,246,0.5);
      color: #93c5fd;
      box-shadow: 0 0 16px rgba(56,130,246,0.2);
    }
    .card-map .card-btn:hover {
      background: linear-gradient(135deg, rgba(56,130,246,0.35), rgba(6,182,212,0.2));
      box-shadow: 0 0 24px rgba(56,130,246,0.4);
      transform: translateY(-1px);
    }

    .card-reader .card-btn {
      background: linear-gradient(135deg, rgba(212,169,106,0.2), rgba(245,158,11,0.1));
      border-color: rgba(212,169,106,0.5);
      color: #f3deae;
      box-shadow: 0 0 16px rgba(212,169,106,0.2);
    }
    .card-reader .card-btn:hover {
      background: linear-gradient(135deg, rgba(212,169,106,0.35), rgba(245,158,11,0.2));
      box-shadow: 0 0 24px rgba(212,169,106,0.4);
      transform: translateY(-1px);
    }

    .card-btn svg { width: 0.85rem; height: 0.85rem; flex-shrink: 0; }

    /* ── 底部状态栏 ── */
    .statusbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.8rem;
      background: rgba(5,8,18,0.6);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: blink 2.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    @media (max-width: 680px) {
      .cards { flex-direction: column; align-items: center; }
      .card { width: min(100%, 320px); }
      .headline h1 { font-size: 1.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card::after, .orb, .card-icon::before { animation: none; transition: none; }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="grid-floor"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- 顶部栏 -->
<header class="topbar">
  <span class="logo-text">FEATURE HUB</span>
  <div class="topbar-line"></div>
  <span class="topbar-tag">v 1.0</span>
</header>

<!-- 主内容 -->
<main class="main">
  <div class="headline">
    <div class="headline-eyebrow">— Select Your Tool —</div>
    <h1>功 能 合 集</h1>
    <p>两个强大工具，一个统一入口 · 点击启动</p>
  </div>

  <div class="cards">

    <!-- 3D 世界地图 -->
    <div class="card card-map">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9.5" stroke="url(#g1)" stroke-width="1.5"/>
          <path d="M12 2.5C12 2.5 8 8 8 12s4 9.5 4 9.5M12 2.5C12 2.5 16 8 16 12s-4 9.5-4 9.5M2.5 12h19" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M4 7.5h16M4 16.5h16" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 1.5"/>
          <defs>
            <linearGradient id="g1" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h2>3D 世界地图</h2>
      <p>交互式三维地球仪，实时旋转探索全球地理信息，支持空间数据可视化与沉浸式地图体验。</p>
      <div class="card-tags">
        <span class="tag">Three.js</span>
        <span class="tag">3D 交互</span>
        <span class="tag">地理可视化</span>
      </div>
      <a class="card-btn" href="https://3d-world-map-zfw.netlify.app/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
        立即启动
      </a>
    </div>

    <!-- 书籍阅读神器 -->
    <div class="card card-reader">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 7h6M9 11h4" stroke="url(#g2)" stroke-width="1.2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g2" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#d4a96a"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h2>书籍阅读神器</h2>
      <p>精美电子书翻页阅读器，温暖书桌场景，真实 3D 书页翻转动画，背景音乐伴读，支持多格式上传。</p>
      <div class="card-tags">
        <span class="tag">3D 翻页</span>
        <span class="tag">作文收录</span>
        <span class="tag">背景音乐</span>
      </div>
      <a class="card-btn" href="https://dianzishuskill-zfw.netlify.app/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
        立即启动
      </a>
    </div>

  </div>
</main>

<!-- 底部状态栏 -->
<footer class="statusbar">
  <div class="status-dot"><span class="dot"></span>ALL SYSTEMS ONLINE</div>
  <div class="status-dot">2 TOOLS AVAILABLE</div>
</footer>

<!-- 粒子动画 -->
<script>
(function () {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let W, H, particles = [], lines = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function initParticles() {
    particles = [];
    const count = Math.min(Math.floor((W * H) / 9000), 120);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: rand(0, W),
        y: rand(0, H),
        r: rand(0.5, 2.2),
        vx: rand(-0.12, 0.12),
        vy: rand(-0.25, -0.05),
        alpha: rand(0.2, 0.85),
        pulse: rand(0, Math.PI * 2),
        pulseSpeed: rand(0.008, 0.025),
        // 0 = white/blue star, 1 = gold accent
        type: Math.random() < 0.12 ? 1 : 0,
      });
    }
  }

  function drawParticle(p) {
    p.pulse += p.pulseSpeed;
    const a = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
    const color = p.type === 1
      ? `rgba(212,169,106,${a})`
      : `rgba(${Math.random() < 0.3 ? "100,200,255" : "180,200,255"},${a})`;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // tiny cross on bright stars
    if (p.r > 1.6 && a > 0.6) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 0.5;
      const s = p.r * 3;
      ctx.beginPath();
      ctx.moveTo(p.x - s, p.y); ctx.lineTo(p.x + s, p.y);
      ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x, p.y + s);
      ctx.stroke();
    }
  }

  function connectParticles() {
    const DIST = 100;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < DIST) {
          const alpha = (1 - dist / DIST) * 0.18;
          ctx.strokeStyle = `rgba(56,130,246,${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  function step() {
    ctx.clearRect(0, 0, W, H);

    connectParticles();

    particles.forEach(p => {
      drawParticle(p);
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -5) { p.y = H + 5; p.x = rand(0, W); }
      if (p.x < -5) p.x = W + 5;
      if (p.x > W + 5) p.x = -5;
    });

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", () => { resize(); initParticles(); });
  resize();
  initParticles();
  step();
})();
</script>
</body>
</html>
